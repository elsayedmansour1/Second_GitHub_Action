name: Test Project
on: push
jobs:
    test:
        run-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/chockout@v3
            - name: Install NodeJS
              uses: actions/setup-node
              with:
                   node-version: 18
            - name: Install dependencies
              run: npm ci
            - name: Run tests
              run: npm test
                 
